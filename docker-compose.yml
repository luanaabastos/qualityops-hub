services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: qualityops_dev
      POSTGRES_USER: qualityops
      POSTGRES_PASSWORD: qualityops
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-create-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qualityops -d qualityops_dev"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
