services:
  - type: web
    name: qualityops-hub
    runtime: docker
    plan: free
    region: virginia
    branch: main
    numInstances: 1
    autoDeployTrigger: off
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node scripts/start-production.mjs
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: DEMO_PIPELINE_LAB_ENABLED
        value: "true"
      - key: DEMO_RUNNER_MODE
        value: "hosted-preview"
      - key: DEMO_MAX_CONCURRENT_RUNS
        value: "2"
      - key: DEMO_RATE_LIMIT_MAX
        value: "4"
      - key: DEMO_RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: DEMO_RUN_COOLDOWN_MS
        value: "10000"
      - key: DEMO_RUN_TIMEOUT_MS
        value: "120000"
