name: Demo report - PocketWallet harness

permissions:
  contents: read

on: workflow_dispatch

jobs:
  mobile-harness-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20.20.1 }
      - run: corepack enable && corepack prepare pnpm@10.34.5 --activate
      - run: pnpm install --frozen-lockfile
      - run: node demo-runners/pocketwallet/harness.mjs SUCCESS artifacts/demo-runs/ci-pocketwallet
      - uses: actions/upload-artifact@v7
        with: { name: pocketwallet-mobile-e2e-json-v1, path: artifacts/demo-runs/ci-pocketwallet/raw-report.json }
      # PocketWallet remains an explicit mobile harness artifact and is not external browser CI.
