name: PocketWallet Demo Pipeline

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Suite to run
        required: true
        default: Mobile
        type: choice
        options:
          - Mobile
          - Smoke
      failureMode:
        description: Failure behavior
        required: true
        default: none
        type: choice
        options:
          - none
          - functional-failure
          - infrastructure-failure

jobs:
  mobile-harness-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: echo "MOBILE HARNESS DEMO"
      - run: node -e "const mode = '${{ github.event.inputs.failureMode }}'; const suite='${{ github.event.inputs.suite }}'; console.log('POCKETWALLET_DEMO'); console.log(JSON.stringify({ product: 'pocketwallet', suite, failureMode: mode, framework: 'MOBILE HARNESS DEMO', modeLabel: 'DEMO' }, null, 2));" > report.json
      - uses: actions/upload-artifact@v4
        with:
          name: pocketwallet-demo-report
          path: report.json
