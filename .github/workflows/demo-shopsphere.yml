name: Demo report - ShopSphere

on: workflow_dispatch

jobs:
  cypress-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20.20.1, cache: pnpm }
      - run: corepack enable && corepack prepare pnpm@10.34.5 --activate
      - run: pnpm install --frozen-lockfile
      - name: Run Cypress and produce real Mochawesome
        run: |
          pnpm --filter @qualityops-hub/web dev --host 127.0.0.1 > web.log 2>&1 &
          curl --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:5173/demo-targets/shopsphere.html
          node demo-runners/shopsphere/run.mjs SUCCESS artifacts/demo-runs/ci-shopsphere
      - uses: actions/upload-artifact@v4
        with: { name: shopsphere-mochawesome, path: artifacts/demo-runs/ci-shopsphere/raw-report.json }
